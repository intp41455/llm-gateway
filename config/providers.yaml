# 多模型 LLM 网关配置
# api_key 一律从环境变量读，不落在文件里。换供应商只改这里，不动代码。

providers:
  deepseek:
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    models: [deepseek-chat, deepseek-reasoner]
    priority: 10
    timeout: 60
  dashscope:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    models: [qwen-plus, qwen-turbo]
    priority: 20
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    models: [gpt-4o-mini]
    priority: 30
  senseaudio:
    base_url: https://api.senseaudio.cn/v1
    api_key_env: SENSEAUDIO_API_KEY
    models: [senseaudio-s2]
    priority: 90

# 对外模型别名 -> 候选链（按顺序降级）
routes:
  default:
    - deepseek:deepseek-chat
    - dashscope:qwen-plus
    - senseaudio:senseaudio-s2
  # 省钱档：先走便宜的
  cheap:
    - dashscope:qwen-turbo
    - deepseek:deepseek-chat
  # 推理档：需要长思考时用
  reasoning:
    - deepseek:deepseek-reasoner
    - openai:gpt-4o-mini
  # 长文/中文语料处理
  long-context:
    - dashscope:qwen-plus
    - openai:gpt-4o-mini

budget:
  daily_tokens: 2000000
  per_provider_daily_tokens: 800000
  price_per_1k:            # 元 / 1K token，用于成本估算
    deepseek: 0.001
    dashscope: 0.0012
    openai: 0.01
    senseaudio: 0.0008

breaker_fail_threshold: 3      # 连续失败 3 次熔断
breaker_recovery_seconds: 30   # 30 秒后半开试探
