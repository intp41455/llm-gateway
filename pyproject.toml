[project]
name = "my-ai-gateway"
version = "1.0.0"
description = "多模型 LLM 网关：模型路由 / 失败降级 / 熔断 / 额度记账 / MCP 工具链治理 / 记忆分层"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
gateway = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
packages = ["app"]
